backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # General Profile & Resume Data
  - name: "profile"
    label: "Profile & Info"
    files:
      - file: "content/profile.json"
        label: "Personal Information"
        name: "profile"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Title / Designation", name: "title", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
          - { label: "Behance URL", name: "behance", widget: "string" }
          - { label: "About / Objective", name: "objective", widget: "text" }
          
          - label: "Professional Skills"
            name: "skills"
            widget: "list"
            field: { label: "Skill Name", name: "skill", widget: "string" }

          - label: "Work Experience"
            name: "experience"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Education & Qualifications"
            name: "education"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Degree / Course", name: "title", widget: "string" }
              - { label: "Institution", name: "institution", widget: "string" }

  # Dynamic Projects Collection
  - name: "projects"
    label: "Portfolio Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Social Media", "Branding & Print", "Motion & Video", "Packaging"] }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Project Link / Behance Link", name: "link", widget: "string", required: false }