backend:
  name: github
  repo: Uzal99/bishnu
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "profile"
    label: "Profile & Info"
    files:
      - file: "content/profile.json"
        label: "Personal Information"
        name: "profile"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - { label: "Title / Designation", name: "title", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
          - { label: "Behance URL", name: "behance", widget: "string" }
          - { label: "About / Objective", name: "objective", widget: "text" }

  - name: "projects"
    label: "Portfolio Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Social Media", "Branding & Print", "Motion & Video", "Packaging"] }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Project Link / Behance Link", name: "link", widget: "string", required: false }