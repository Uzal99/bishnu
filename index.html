<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bishnu Bhusal | Portfolio</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem 1rem; max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid #334155; }
    header h1 { font-size: 2.5rem; color: var(--accent); }
    header p { font-size: 1.2rem; color: var(--text-muted); }
    .contact-links { margin-top: 1rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
    .contact-links a { color: var(--accent); text-decoration: none; border: 1px solid var(--accent); padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.9rem; }
    section { margin-bottom: 3rem; }
    h2 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--accent); border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 0.2rem; }
    .skills-flex { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .skill-badge { background: var(--card-bg); border: 1px solid #334155; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.9rem; }
    .timeline-item { background: var(--card-bg); padding: 1.2rem; border-radius: 8px; margin-bottom: 1rem; border-left: 4px solid var(--accent); }
    .timeline-item h3 { font-size: 1.1rem; }
    .timeline-item .sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
    .project-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; }
    .project-card img { width: 100%; height: 200px; object-fit: cover; }
    .project-info { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
    .project-info h3 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .project-info .category { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.5rem; font-weight: bold; }
    .project-info p { color: var(--text-muted); font-size: 0.9rem; flex: 1; }
    .project-info a { margin-top: 1rem; color: var(--accent); text-decoration: none; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header id="profile-header">
    <h1 id="user-name">Loading...</h1>
    <p id="user-title"></p>
    <div class="contact-links" id="contact-links"></div>
  </header>

  <section>
    <h2>About Me</h2>
    <p id="user-objective" style="margin-top: 0.5rem;"></p>
  </section>

  <section>
    <h2>Skills</h2>
    <div class="skills-flex" id="skills-list"></div>
  </section>

  <section>
    <h2>Projects</h2>
    <div class="projects-grid" id="projects-list"></div>
  </section>

  <section>
    <h2>Work Experience</h2>
    <div id="experience-list"></div>
  </section>

  <section>
    <h2>Education & Certifications</h2>
    <div id="education-list"></div>
  </section>

  <script src="js/app.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
